<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wsx 笔记编辑器</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --bg-header: #f0f0f0;
            --bg-editor: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-muted: #999999;
            --accent: #e94560;
            --accent-hover: #ff6b6b;
            --border: #dddddd;
        }

        [data-theme="dark"] {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-header: #16213e;
            --bg-editor: #16213e;
            --text-primary: #eeeeee;
            --text-secondary: #aaaaaa;
            --text-muted: #555555;
            --border: #0f3460;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; }
        .header { background: var(--bg-header); padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .header h1 { font-size: 1.2rem; color: var(--accent); }
        .note-name { color: var(--text-secondary); font-size: 0.9rem; }
        .toolbar { display: flex; align-items: center; gap: 4px; }
        .toolbar-btn { background: transparent; border: 1px solid transparent; color: var(--text-primary); padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .toolbar-btn:hover { background: var(--bg-secondary); border-color: var(--border); }
        .toolbar-sep { width: 1px; height: 20px; background: var(--border); margin: 0 8px; }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .theme-toggle { background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .theme-toggle:hover { background: var(--accent); color: white; }
        .main-container { flex: 1; display: flex; overflow: hidden; }
        .editor-pane, .preview-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .pane-header { background: var(--bg-secondary); padding: 8px 16px; font-size: 0.8rem; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
        .editor-wrapper { flex: 1; padding: 16px; background: var(--bg-editor); overflow: auto; }
        textarea { width: 100%; height: 100%; min-height: calc(100vh - 140px); background: transparent; border: none; color: var(--text-primary); font-size: 15px; line-height: 1.8; resize: none; font-family: monospace; }
        textarea:focus { outline: none; }
        .preview-wrapper { flex: 1; padding: 16px; background: var(--bg-primary); overflow: auto; }
        .preview-content { max-width: 800px; margin: 0 auto; line-height: 1.8; font-size: 15px; font-family: monospace; }
        .preview-content .line { display: block; }
        .preview-content .h1 { font-size: 2em; font-weight: bold; margin: 0.5em 0; }
        .preview-content .h2 { font-size: 1.5em; font-weight: bold; margin: 0.5em 0; }
        .preview-content .h3 { font-size: 1.25em; font-weight: bold; margin: 0.5em 0; }
        .preview-content .quote { border-left: 4px solid var(--accent); padding-left: 12px; color: var(--text-secondary); margin: 0.5em 0; }
        .preview-content .code { background: var(--bg-secondary); padding: 2px 6px; border-radius: 4px; color: var(--accent); }
        .preview-content .url { color: var(--accent); text-decoration: underline; }
        .footer { background: var(--bg-secondary); padding: 8px 20px; font-size: 0.75rem; color: var(--text-muted); border-top: 1px solid var(--border); display: flex; justify-content: space-between; }
        .footer kbd { background: var(--bg-primary); padding: 2px 5px; border-radius: 3px; margin: 0 2px; border: 1px solid var(--border); }
        button { background: var(--accent); color: white; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        button:hover { background: var(--accent); filter: brightness(1.1); }
        .status { color: var(--text-secondary); font-size: 0.9rem; }
        @media (max-width: 768px) { .main-container { flex-direction: column; } .preview-pane { display: none; } .toolbar { display: none; } }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <h1>📝 wsx</h1>
            <span class="note-name" id="noteNameDisplay"></span>
        </div>
        <div class="toolbar">
            <button class="toolbar-btn" onclick="format('bold')" title="加粗"><b>B</b></button>
            <button class="toolbar-btn" onclick="format('italic')" title="斜体"><i>I</i></button>
            <button class="toolbar-btn" onclick="format('strike')" title="删除线"><s>S</s></button>
            <button class="toolbar-btn" onclick="format('underline')" title="下划线"><u>U</u></button>
            <div class="toolbar-sep"></div>
            <button class="toolbar-btn" onclick="format('h1')">H1</button>
            <button class="toolbar-btn" onclick="format('h2')">H2</button>
            <button class="toolbar-btn" onclick="format('h3')">H3</button>
            <div class="toolbar-sep"></div>
            <button class="toolbar-btn" onclick="format('quote')">❝</button>
            <button class="toolbar-btn" onclick="format('code')">code</button>
        </div>
        <div class="header-right">
            <button class="theme-toggle" id="themeToggle">🌙 深色</button>
        </div>
    </div>

    <div class="main-container">
        <div class="editor-pane">
            <div class="pane-header">✏️ 编辑</div>
            <div class="editor-wrapper">
                <textarea id="editor" placeholder="在这里开始写作..."></textarea>
            </div>
        </div>
        <div class="preview-pane">
            <div class="pane-header">👁️ 预览</div>
            <div class="preview-wrapper">
                <div class="preview-content" id="preview"></div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div>
            <kbd>Ctrl</kbd>+<kbd>S</kbd> 保存 |
            <kbd>Ctrl</kbd>+<kbd>B</kbd> 加粗 |
            <kbd>Ctrl</kbd>+<kbd>I</kbd> 斜体 |
            <kbd>Ctrl</kbd>+<kbd>P</kbd> 切换预览
        </div>
        <div><span class="status" id="status">就绪</span></div>
    </div>

    <script>
        const Parser = {
            parse(text) {
                if (!text) return '';
                let html = text
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');

                // 行级处理
                const lines = html.split('\n');
                html = lines.map(line => {
                    if (line.startsWith('===')) return '<span class="h1 line">' + this.escapeHtml(line.slice(4)) + '</span>';
                    if (line.startsWith('== ')) return '<span class="h2 line">' + this.escapeHtml(line.slice(3)) + '</span>';
                    if (line.startsWith('= ')) return '<span class="h3 line">' + this.escapeHtml(line.slice(2)) + '</span>';
                    if (line.startsWith('&gt;')) return '<span class="quote line">' + this.escapeHtml(line.slice(5)) + '</span>';
                    return '<span class="line">' + this.parseInline(line) + '</span>';
                }).join('\n');
                return html;
            },

            parseInline(text) {
                // 简单替换：代码 -> 加粗 -> 斜体 -> 删除线 -> 下划线
                // 注意：这里不对已有 HTML 标签的内容进行处理
                text = this.escapeHtml(text);

                // 代码块 ``code``
                text = text.replace(/``([^`]+)``/g, '<span class="code">$1</span>');
                // 加粗 **text**
                text = text.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
                // 斜体 *text*（要确保前后不是 *）
                text = text.replace(/(?<![^*])\*([^*]+)\*(?![^*])/g, '<i>$1</i>');
                // 删除线 ~~text~~
                text = text.replace(/~~([^~]+)~~/g, '<s>$1</s>');
                // 下划线 __text__
                text = text.replace(/__([^_]+)__/g, '<u>$1</u>');
                // URL
                text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" class="url" target="_blank">$1</a>');

                return text;
            },

            escapeHtml(text) {
                return text;
            }
        };

        const Editor = {
            noteName: '',
            hasChanges: false,
            isSaving: false,
            showPreview: true,

            init() {
                this.elements = {
                    editor: document.getElementById('editor'),
                    preview: document.getElementById('preview'),
                    status: document.getElementById('status'),
                    noteNameDisplay: document.getElementById('noteNameDisplay'),
                    themeToggle: document.getElementById('themeToggle')
                };

                this.noteName = this.getNoteNameFromUrl();
                this.elements.noteNameDisplay.textContent = this.noteName || '新建笔记';
                document.title = this.noteName || 'wsx 笔记编辑器';

                this.loadTheme();
                this.bindEvents();
                this.loadNote();
            },

            getNoteNameFromUrl() {
                const params = new URLSearchParams(window.location.search);
                return params.get('note') ? decodeURIComponent(params.get('note')) : '';
            },

            loadTheme() {
                const theme = localStorage.getItem('wsx-theme') || 'light';
                if (theme === 'dark') {
                    document.body.setAttribute('data-theme', 'dark');
                    this.elements.themeToggle.textContent = '☀️ 浅色';
                }
            },

            toggleTheme() {
                const isDark = document.body.getAttribute('data-theme') === 'dark';
                if (isDark) {
                    document.body.removeAttribute('data-theme');
                    localStorage.setItem('wsx-theme', 'light');
                    this.elements.themeToggle.textContent = '🌙 深色';
                } else {
                    document.body.setAttribute('data-theme', 'dark');
                    localStorage.setItem('wsx-theme', 'dark');
                    this.elements.themeToggle.textContent = '☀️ 浅色';
                }
            },

            bindEvents() {
                this.elements.editor.addEventListener('input', () => {
                    this.hasChanges = true;
                    this.setStatus('未保存', '');
                    this.updatePreview();
                });

                this.elements.themeToggle.addEventListener('click', () => this.toggleTheme());

                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey || e.metaKey) {
                        switch (e.key.toLowerCase()) {
                            case 's': e.preventDefault(); this.save(); break;
                            case 'b': e.preventDefault(); this.wrapSelection('**', '**'); break;
                            case 'i': e.preventDefault(); this.wrapSelection('*', '*'); break;
                            case 'p': e.preventDefault(); this.togglePreview(); break;
                        }
                    }
                });

                window.addEventListener('beforeunload', (e) => {
                    if (this.hasChanges) { e.preventDefault(); e.returnValue = ''; }
                });
            },

            updatePreview() {
                const content = this.elements.editor.value;
                this.elements.preview.innerHTML = Parser.parse(content);
            },

            togglePreview() {
                this.showPreview = !this.showPreview;
                document.querySelector('.preview-pane').style.display = this.showPreview ? 'flex' : 'none';
            },

            wrapSelection(before, after) {
                const editor = this.elements.editor;
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                const text = editor.value;
                const selected = text.substring(start, end) || '文字';

                editor.value = text.substring(0, start) + before + selected + after + text.substring(end);
                editor.selectionStart = start + before.length;
                editor.selectionEnd = start + before.length + selected.length;
                editor.focus();

                this.hasChanges = true;
                this.setStatus('未保存', '');
                this.updatePreview();
            },

            async loadNote() {
                if (!this.noteName) { this.setStatus('新建笔记', ''); this.updatePreview(); return; }
                try {
                    const response = await fetch(`/api/note/${encodeURIComponent(this.noteName)}`);
                    if (!response.ok) { if (response.status === 404) { this.setStatus('新建笔记', ''); this.updatePreview(); return; } throw new Error(); }
                    const data = await response.json();
                    if (data.content) { this.elements.editor.value = data.content; this.updatePreview(); }
                    this.setStatus('已加载', 'saved');
                } catch (err) { this.setStatus('加载失败', 'error'); }
            },

            async save() {
                if (this.isSaving || !this.hasChanges) return;
                this.isSaving = true;
                this.setStatus('保存中...', 'saving');
                try {
                    const response = await fetch(`/api/note/${encodeURIComponent(this.noteName)}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: this.elements.editor.value })
                    });
                    if (!response.ok) throw new Error();
                    this.hasChanges = false;
                    this.setStatus('已保存 ✓', 'saved');
                    setTimeout(() => { if (this.elements.status.textContent === '已保存 ✓') this.setStatus('已保存', 'saved'); }, 2000);
                } catch (err) { this.setStatus('保存失败', 'error'); }
                finally { this.isSaving = false; }
            },

            setStatus(text, className) {
                this.elements.status.textContent = text;
                this.elements.status.className = 'status ' + className;
            }
        };

        function format(type) {
            const map = { bold: ['**', '**'], italic: ['*', '*'], strike: ['~~', '~~'], underline: ['__', '__'],
                         h1: ['=== ', ''], h2: ['== ', ''], h3: ['= ', ''], quote: ['> ', ''], code: ['`', '`'] };
            const [before, after] = map[type] || ['', ''];
            Editor.wrapSelection(before, after);
        }

        document.addEventListener('DOMContentLoaded', () => Editor.init());
    </script>
</body>
</html>
