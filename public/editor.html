<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wsx 笔记编辑器</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --bg-header: #f0f0f0;
            --bg-editor: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-muted: #999999;
            --accent: #e94560;
            --accent-hover: #ff6b6b;
            --border: #dddddd;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-header: #16213e;
            --bg-editor: #16213e;
            --text-primary: #eeeeee;
            --text-secondary: #aaaaaa;
            --text-muted: #555555;
            --accent: #e94560;
            --accent-hover: #ff6b6b;
            --border: #0f3460;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.3s, color 0.3s;
        }

        .header {
            background: var(--bg-header);
            padding: 15px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.3s, border-color 0.3s;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header h1 {
            font-size: 1.3rem;
            color: var(--accent);
        }

        .header h1 span { margin-right: 8px; }

        .note-name {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-toggle {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .editor-pane, .preview-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .pane-header {
            background: var(--bg-secondary);
            padding: 10px 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
            font-weight: 500;
            transition: background 0.3s, border-color 0.3s;
        }

        .editor-wrapper {
            flex: 1;
            padding: 20px;
            background: var(--bg-editor);
            overflow: auto;
            transition: background 0.3s;
        }

        textarea {
            width: 100%;
            height: 100%;
            min-height: calc(100vh - 180px);
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 16px;
            line-height: 1.8;
            resize: none;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
            transition: color 0.3s;
        }

        textarea:focus { outline: none; }
        textarea::placeholder { color: var(--text-muted); }

        .preview-wrapper {
            flex: 1;
            padding: 20px;
            background: var(--bg-primary);
            overflow: auto;
            transition: background 0.3s;
        }

        .preview-content {
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.8;
            font-size: 16px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
        }

        .toolbar {
            background: var(--bg-header);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid var(--border);
            transition: background 0.3s, border-color 0.3s;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover { background: var(--accent-hover); }
        button:disabled { background: var(--text-muted); cursor: not-allowed; }

        .status {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-left: auto;
        }
        .status.saving { color: #f39c12; }
        .status.saved { color: #27ae60; }
        .status.error { color: #e74c3c; }

        .error-overlay {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: #e74c3c;
            color: white;
            padding: 12px 24px;
            text-align: center;
            display: none;
            z-index: 1000;
        }
        .error-overlay.show { display: block; }

        .shortcuts {
            background: var(--bg-secondary);
            padding: 8px 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            transition: background 0.3s, border-color 0.3s;
        }

        .shortcuts kbd {
            background: var(--bg-primary);
            padding: 2px 6px;
            border-radius: 4px;
            margin: 0 2px;
            border: 1px solid var(--border);
        }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .preview-pane { display: none; }
        }
    </style>
</head>
<body>
    <div class="error-overlay" id="errorOverlay"></div>

    <div class="header">
        <div class="header-left">
            <h1><span>📝</span>wsx</h1>
            <span class="note-name" id="noteNameDisplay"></span>
        </div>
        <div class="header-right">
            <button class="theme-toggle" id="themeToggle">🌙 深色模式</button>
        </div>
    </div>

    <div class="main-container">
        <div class="editor-pane">
            <div class="pane-header">✏️ 编辑</div>
            <div class="editor-wrapper">
                <textarea
                    id="editor"
                    placeholder="在这里开始写作..."
                    spellcheck="false"
                ></textarea>
            </div>
        </div>

        <div class="preview-pane">
            <div class="pane-header">👁️ 预览</div>
            <div class="preview-wrapper">
                <div class="preview-content" id="preview"></div>
            </div>
        </div>
    </div>

    <div class="shortcuts">
        <kbd>Ctrl</kbd>+<kbd>S</kbd> 保存 | <kbd>Ctrl</kbd>+<kbd>P</kbd> 切换预览
    </div>

    <div class="toolbar">
        <button id="saveBtn">💾 保存</button>
        <span class="status" id="status">就绪</span>
    </div>

    <script>
        const Editor = {
            noteName: '',
            hasChanges: false,
            isSaving: false,
            showPreview: true,

            elements: {
                editor: document.getElementById('editor'),
                preview: document.getElementById('preview'),
                status: document.getElementById('status'),
                noteNameDisplay: document.getElementById('noteNameDisplay'),
                saveBtn: document.getElementById('saveBtn'),
                errorOverlay: document.getElementById('errorOverlay'),
                themeToggle: document.getElementById('themeToggle')
            },

            init() {
                this.noteName = this.getNoteNameFromUrl();
                this.elements.noteNameDisplay.textContent = this.noteName || '新建笔记';
                document.title = this.noteName || 'wsx 笔记编辑器';

                this.loadTheme();
                this.bindEvents();
                this.loadNote();
            },

            getNoteNameFromUrl() {
                const params = new URLSearchParams(window.location.search);
                return params.get('note') ? decodeURIComponent(params.get('note')) : '';
            },

            loadTheme() {
                const theme = localStorage.getItem('wsx-theme') || 'light';
                if (theme === 'dark') {
                    document.body.setAttribute('data-theme', 'dark');
                    this.elements.themeToggle.textContent = '☀️ 浅色模式';
                }
            },

            toggleTheme() {
                const isDark = document.body.getAttribute('data-theme') === 'dark';
                if (isDark) {
                    document.body.removeAttribute('data-theme');
                    localStorage.setItem('wsx-theme', 'light');
                    this.elements.themeToggle.textContent = '🌙 深色模式';
                } else {
                    document.body.setAttribute('data-theme', 'dark');
                    localStorage.setItem('wsx-theme', 'dark');
                    this.elements.themeToggle.textContent = '☀️ 浅色模式';
                }
            },

            bindEvents() {
                this.elements.editor.addEventListener('input', () => {
                    this.hasChanges = true;
                    this.setStatus('未保存', '');
                    this.updatePreview();
                });

                this.elements.saveBtn.addEventListener('click', () => this.save());
                this.elements.themeToggle.addEventListener('click', () => this.toggleTheme());

                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey || e.metaKey) {
                        switch (e.key.toLowerCase()) {
                            case 's':
                                e.preventDefault();
                                this.save();
                                break;
                            case 'p':
                                e.preventDefault();
                                this.togglePreview();
                                break;
                        }
                    }
                });

                window.addEventListener('beforeunload', (e) => {
                    if (this.hasChanges) {
                        e.preventDefault();
                        e.returnValue = '';
                    }
                });
            },

            updatePreview() {
                const content = this.elements.editor.value;
                // 纯文本显示，HTML 转义
                this.elements.preview.textContent = content;
            },

            togglePreview() {
                const previewPane = document.querySelector('.preview-pane');
                this.showPreview = !this.showPreview;
                previewPane.style.display = this.showPreview ? 'flex' : 'none';
            },

            async loadNote() {
                if (!this.noteName) {
                    this.setStatus('新建笔记', '');
                    this.updatePreview();
                    return;
                }

                try {
                    const response = await fetch(`/api/note/${encodeURIComponent(this.noteName)}`);

                    if (!response.ok) {
                        if (response.status === 404) {
                            this.setStatus('新建笔记', '');
                            this.updatePreview();
                            return;
                        }
                        throw new Error('加载失败');
                    }

                    const data = await response.json();

                    if (data.content) {
                        this.elements.editor.value = data.content;
                        this.updatePreview();
                    }

                    this.setStatus('已加载', 'saved');
                } catch (err) {
                    this.showError('加载失败: ' + err.message);
                    this.setStatus('加载失败', 'error');
                }
            },

            async save() {
                if (this.isSaving || !this.hasChanges) return;

                this.isSaving = true;
                this.elements.saveBtn.disabled = true;
                this.setStatus('保存中...', 'saving');

                try {
                    const response = await fetch(`/api/note/${encodeURIComponent(this.noteName)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: this.elements.editor.value })
                    });

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.error || '保存失败');
                    }

                    this.hasChanges = false;
                    this.setStatus('已保存 ✓', 'saved');

                    setTimeout(() => {
                        if (this.elements.status.textContent === '已保存 ✓') {
                            this.setStatus('已保存', 'saved');
                        }
                    }, 2000);
                } catch (err) {
                    this.showError('保存失败: ' + err.message);
                    this.setStatus('保存失败', 'error');
                } finally {
                    this.isSaving = false;
                    this.elements.saveBtn.disabled = false;
                }
            },

            setStatus(text, className) {
                this.elements.status.textContent = text;
                this.elements.status.className = 'status ' + className;
            },

            showError(message) {
                this.elements.errorOverlay.textContent = message;
                this.elements.errorOverlay.classList.add('show');
                setTimeout(() => {
                    this.elements.errorOverlay.classList.remove('show');
                }, 3000);
            }
        };

        document.addEventListener('DOMContentLoaded', () => { Editor.init(); });
    </script>
</body>
</html>
