<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wsx 笔记编辑器</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --bg-header: #f0f0f0;
            --bg-editor: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-muted: #999999;
            --accent: #e94560;
            --accent-hover: #ff6b6b;
            --border: #dddddd;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-header: #16213e;
            --bg-editor: #16213e;
            --text-primary: #eeeeee;
            --text-secondary: #aaaaaa;
            --text-muted: #555555;
            --accent: #e94560;
            --accent-hover: #ff6b6b;
            --border: #0f3460;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.3s, color 0.3s;
        }

        .header {
            background: var(--bg-header);
            padding: 15px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.3s, border-color 0.3s;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header h1 {
            font-size: 1.3rem;
            color: var(--accent);
        }

        .header h1 span { margin-right: 8px; }

        .note-name {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-toggle {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .editor-pane, .preview-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .pane-header {
            background: var(--bg-secondary);
            padding: 10px 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
            font-weight: 500;
            transition: background 0.3s, border-color 0.3s;
        }

        .editor-wrapper {
            flex: 1;
            padding: 20px;
            background: var(--bg-editor);
            overflow: auto;
            transition: background 0.3s;
        }

        textarea {
            width: 100%;
            height: 100%;
            min-height: calc(100vh - 180px);
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 16px;
            line-height: 1.8;
            resize: none;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
            transition: color 0.3s;
        }

        textarea:focus { outline: none; }
        textarea::placeholder { color: var(--text-muted); }

        .preview-wrapper {
            flex: 1;
            padding: 20px;
            background: var(--bg-primary);
            overflow: auto;
            transition: background 0.3s;
        }

        .preview-content {
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.8;
            font-size: 16px;
        }

        .preview-content h1 { font-size: 2rem; margin: 1rem 0; color: var(--text-primary); }
        .preview-content h2 { font-size: 1.5rem; margin: 0.8rem 0; color: var(--text-primary); }
        .preview-content h3 { font-size: 1.25rem; margin: 0.6rem 0; color: var(--text-primary); }
        .preview-content p { margin: 0.5rem 0; }
        .preview-content strong { font-weight: bold; color: var(--text-primary); }
        .preview-content em { font-style: italic; }
        .preview-content code {
            background: var(--bg-secondary);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9em;
            color: var(--accent);
        }
        .preview-content pre {
            background: var(--bg-secondary);
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1rem 0;
        }
        .preview-content pre code {
            background: none;
            padding: 0;
            color: var(--text-primary);
        }
        .preview-content blockquote {
            border-left: 4px solid var(--accent);
            padding-left: 16px;
            margin: 1rem 0;
            color: var(--text-secondary);
        }
        .preview-content a { color: var(--accent); }
        .preview-content ul, .preview-content ol { margin: 0.5rem 0; padding-left: 24px; }
        .preview-content li { margin: 0.25rem 0; }
        .preview-content hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }

        .toolbar {
            background: var(--bg-header);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid var(--border);
            transition: background 0.3s, border-color 0.3s;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover { background: var(--accent-hover); }
        button:disabled { background: var(--text-muted); cursor: not-allowed; }

        .status {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-left: auto;
        }

        .status.saving { color: #f39c12; }
        .status.saved { color: #27ae60; }
        .status.error { color: #e74c3c; }

        .error-overlay {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: #e74c3c;
            color: white;
            padding: 12px 24px;
            text-align: center;
            display: none;
            z-index: 1000;
        }

        .error-overlay.show { display: block; }

        .shortcuts {
            background: var(--bg-secondary);
            padding: 8px 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            transition: background 0.3s, border-color 0.3s;
        }

        .shortcuts kbd {
            background: var(--bg-primary);
            padding: 2px 6px;
            border-radius: 4px;
            margin: 0 2px;
            border: 1px solid var(--border);
        }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .preview-pane { display: none; }
        }
    </style>
</head>
<body>
    <div class="error-overlay" id="errorOverlay"></div>

    <div class="header">
        <div class="header-left">
            <h1><span>📝</span>wsx</h1>
            <span class="note-name" id="noteNameDisplay"></span>
        </div>
        <div class="header-right">
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙 深色模式</button>
        </div>
    </div>

    <div class="main-container">
        <div class="editor-pane">
            <div class="pane-header">✏️ 编辑</div>
            <div class="editor-wrapper">
                <textarea
                    id="editor"
                    placeholder="在这里开始写作，支持 Markdown 语法..."
                    spellcheck="false"
                ></textarea>
            </div>
        </div>

        <div class="preview-pane">
            <div class="pane-header">👁️ 预览</div>
            <div class="preview-wrapper">
                <div class="preview-content" id="preview"></div>
            </div>
        </div>
    </div>

    <div class="shortcuts">
        <kbd>Ctrl</kbd>+<kbd>S</kbd> 保存 | <kbd>Ctrl</kbd>+<kbd>B</kbd> 加粗 | <kbd>Ctrl</kbd>+<kbd>I</kbd> 斜体 | <kbd>Ctrl</kbd>+<kbd>P</kbd> 切换预览
    </div>

    <div class="toolbar">
        <button id="saveBtn" onclick="saveNote()">💾 保存</button>
        <span class="status" id="status">就绪</span>
    </div>

    <script>
        // Markdown 解析器
        const MarkdownParser = {
            parse(text) {
                if (!text) return '';

                let html = text
                    // 转义 HTML 特殊字符
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')

                    // 代码块（必须最先处理）
                    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')

                    // 行内代码
                    .replace(/`([^`]+)`/g, '<code>$1</code>')

                    // 标题
                    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
                    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
                    .replace(/^# (.+)$/gm, '<h1>$1</h1>')

                    // 加粗和斜体
                    .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
                    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.+?)\*/g, '<em>$1</em>')
                    .replace(/___(.+?)___/g, '<strong><em>$1</em></strong>')
                    .replace(/__(.+?)__/g, '<strong>$1</strong>')
                    .replace(/_(.+?)_/g, '<em>$1</em>')

                    // 删除线
                    .replace(/~~(.+?)~~/g, '<del>$1</del>')

                    // 链接
                    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')

                    // 图片（暂时不支持）
                    // .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">')

                    // 引用
                    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')

                    // 水平线
                    .replace(/^---$/gm, '<hr>')
                    .replace(/^\*\*\*$/gm, '<hr>')

                    // 无序列表
                    .replace(/^[\*\-] (.+)$/gm, '<li>$1</li>')

                    // 有序列表
                    .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')

                    // 段落（换行）
                    .replace(/\n\n/g, '</p><p>')
                    .replace(/\n/g, '<br>');

                // 包裹在段落中
                html = '<p>' + html + '</p>';

                // 清理空段落
                html = html.replace(/<p><\/p>/g, '');
                html = html.replace(/<p>(<h[1-3]>)/g, '$1');
                html = html.replace(/(<\/h[1-3]>)<\/p>/g, '$1');
                html = html.replace(/<p>(<pre>)/g, '$1');
                html = html.replace(/(<\/pre>)<\/p>/g, '$1');
                html = html.replace(/<p>(<blockquote>)/g, '$1');
                html = html.replace(/(<\/blockquote>)<\/p>/g, '$1');
                html = html.replace(/<p>(<hr>)<\/p>/g, '$1');
                html = html.replace(/<p>(<li>)/g, '<ul>$1');
                html = html.replace(/(<\/li>)<\/p>/g, '$1</ul>');
                html = html.replace(/<\/li><br>/g, '</li>');

                // 合并连续的 li
                html = html.replace(/<\/li><ul>/g, '</ul><ul>');
                html = html.replace(/<\/ul><ul>/g, '');
                html = html.replace(/<\/li><li>/g, '</li><li>');

                return html;
            }
        };

        // 编辑器主模块
        const Editor = {
            noteName: '',
            hasChanges: false,
            isSaving: false,
            showPreview: true,

            elements: {
                editor: document.getElementById('editor'),
                preview: document.getElementById('preview'),
                status: document.getElementById('status'),
                noteNameDisplay: document.getElementById('noteNameDisplay'),
                saveBtn: document.getElementById('saveBtn'),
                errorOverlay: document.getElementById('errorOverlay')
            },

            init() {
                this.noteName = this.getNoteNameFromUrl();
                this.elements.noteNameDisplay.textContent = this.noteName || '新建笔记';
                document.title = this.noteName || 'wsx 笔记编辑器';

                this.loadTheme();
                this.bindEvents();
                this.loadNote();
            },

            getNoteNameFromUrl() {
                const params = new URLSearchParams(window.location.search);
                return params.get('note') ? decodeURIComponent(params.get('note')) : '';
            },

            loadTheme() {
                const theme = localStorage.getItem('wsx-theme') || 'light';
                if (theme === 'dark') {
                    document.body.setAttribute('data-theme', 'dark');
                    document.getElementById('themeToggle').textContent = '☀️ 浅色模式';
                }
            },

            toggleTheme() {
                const isDark = document.body.getAttribute('data-theme') === 'dark';
                if (isDark) {
                    document.body.removeAttribute('data-theme');
                    localStorage.setItem('wsx-theme', 'light');
                    document.getElementById('themeToggle').textContent = '🌙 深色模式';
                } else {
                    document.body.setAttribute('data-theme', 'dark');
                    localStorage.setItem('wsx-theme', 'dark');
                    document.getElementById('themeToggle').textContent = '☀️ 浅色模式';
                }
            },

            bindEvents() {
                this.elements.editor.addEventListener('input', () => {
                    this.hasChanges = true;
                    this.setStatus('未保存', '');
                    this.updatePreview();
                });

                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey || e.metaKey) {
                        switch (e.key.toLowerCase()) {
                            case 's':
                                e.preventDefault();
                                this.save();
                                break;
                            case 'b':
                                e.preventDefault();
                                this.wrapSelection('**', '**');
                                break;
                            case 'i':
                                e.preventDefault();
                                this.wrapSelection('*', '*');
                                break;
                            case 'p':
                                e.preventDefault();
                                this.togglePreview();
                                break;
                        }
                    }
                });

                window.addEventListener('beforeunload', (e) => {
                    if (this.hasChanges) {
                        e.preventDefault();
                        e.returnValue = '';
                    }
                });
            },

            updatePreview() {
                const content = this.elements.editor.value;
                this.elements.preview.innerHTML = MarkdownParser.parse(content);
            },

            togglePreview() {
                const previewPane = document.querySelector('.preview-pane');
                this.showPreview = !this.showPreview;
                previewPane.style.display = this.showPreview ? 'flex' : 'none';
            },

            async loadNote() {
                if (!this.noteName) {
                    this.setStatus('新建笔记', '');
                    this.updatePreview();
                    return;
                }

                try {
                    const response = await fetch(`/api/note/${encodeURIComponent(this.noteName)}`);

                    if (!response.ok) {
                        if (response.status === 404) {
                            this.setStatus('新建笔记', '');
                            this.updatePreview();
                            return;
                        }
                        throw new Error('加载失败');
                    }

                    const data = await response.json();

                    if (data.content) {
                        this.elements.editor.value = data.content;
                        this.updatePreview();
                    }

                    this.setStatus('已加载', 'saved');
                } catch (err) {
                    this.showError('加载失败: ' + err.message);
                    this.setStatus('加载失败', 'error');
                }
            },

            async save() {
                if (this.isSaving || !this.hasChanges) return;

                this.isSaving = true;
                this.elements.saveBtn.disabled = true;
                this.setStatus('保存中...', 'saving');

                try {
                    const response = await fetch(`/api/note/${encodeURIComponent(this.noteName)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: this.elements.editor.value })
                    });

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.error || '保存失败');
                    }

                    this.hasChanges = false;
                    this.setStatus('已保存 ✓', 'saved');

                    setTimeout(() => {
                        if (this.elements.status.textContent === '已保存 ✓') {
                            this.setStatus('已保存', 'saved');
                        }
                    }, 2000);
                } catch (err) {
                    this.showError('保存失败: ' + err.message);
                    this.setStatus('保存失败', 'error');
                } finally {
                    this.isSaving = false;
                    this.elements.saveBtn.disabled = false;
                }
            },

            wrapSelection(before, after) {
                const editor = this.elements.editor;
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                const text = editor.value;
                const selected = text.substring(start, end);

                editor.value = text.substring(0, start) + before + selected + after + text.substring(end);
                editor.selectionStart = start + before.length;
                editor.selectionEnd = end + before.length;
                editor.focus();

                this.hasChanges = true;
                this.setStatus('未保存', '');
                this.updatePreview();
            },

            setStatus(text, className) {
                this.elements.status.textContent = text;
                this.elements.status.className = 'status ' + className;
            },

            showError(message) {
                this.elements.errorOverlay.textContent = message;
                this.elements.errorOverlay.classList.add('show');
                setTimeout(() => {
                    this.elements.errorOverlay.classList.remove('show');
                }, 3000);
            }
        };

        function saveNote() { Editor.save(); }
        function toggleTheme() { Editor.toggleTheme(); }

        document.addEventListener('DOMContentLoaded', () => { Editor.init(); });
    </script>
</body>
</html>
